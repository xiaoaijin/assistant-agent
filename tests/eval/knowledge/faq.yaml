- question: 发货后多久能到？
  answer: 华东、华北地区下单后 48 小时内发货，物流 2-4 天送达；偏远地区 5-7 天。

- question: 可以修改收货地址吗？
  answer: 订单未发货前可在订单详情页自助修改地址；已发货订单无法修改，可拒收后重新下单。

- question: 支持哪些付款方式？
  answer: 支持微信支付、支付宝、银联银行卡，大额订单（超过 5000 元）暂不支持在线支付，需联系客服对公转账。

- question: 发票怎么开？
  answer: 电子发票在订单完成后于订单详情页自助申请，支持开普票和专票，专票需填写抬头税号，24 小时内开出。

- question: 优惠券可以叠加使用吗？
  answer: 满减券与折扣券不可叠加，平台券与店铺券可以叠加，具体以结算页提示为准。

- question: 收到的商品是假货怎么办？
  answer: 本店全部为正品行货，支持专柜验货。如怀疑假货可提供品牌方鉴定凭证，一经确认假一赔十并承担检测费用。
